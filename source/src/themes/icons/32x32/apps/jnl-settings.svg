<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="44" height="22" rx="11" fill="#FFFFFF" opacity="0.08"/>
  <g transform="translate(24 25)" filter="url(#softShadow)">
    <g fill="#FFFFFF">
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(45)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(90)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(135)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(180)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(225)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(270)"/>
      <rect x="-2.5" y="-15.5" width="5" height="6" rx="1.5" transform="rotate(315)"/>
    </g>
    <circle r="10.5" fill="#FFFFFF"/>
    <circle r="4.5" fill="#1E3A8A"/>
  </g>
</svg>

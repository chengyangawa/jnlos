<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0" dy="1" result="offsetBlur"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="44" height="22" rx="11" fill="#FFFFFF" opacity="0.06"/>
  <rect x="9" y="12" width="30" height="24" rx="3" fill="#000000" opacity="0.3"/>
  <rect x="10" y="13" width="28" height="22" rx="2" fill="#050505"/>
  <path d="M15 20 L20 25 L15 30" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#greenGlow)"/>
  <line x1="23" y1="30" x2="31" y2="30" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" filter="url(#greenGlow)"/>
  <circle cx="24" cy="39" r="1.2" fill="#FFFFFF" opacity="0.5"/>
</svg>

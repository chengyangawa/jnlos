#
# /etc/pacman.conf
#
# Java Net Lava OS - archiso 使用的 pacman 配置
# 基于 Arch Linux 官方 archiso releng 模板
#

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#Color
#CheckSpace
ParallelDownloads = 5

# PGP signature checking
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

#
# REPOSITORIES
#

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib - 启用以支持 lib32 包（NVIDIA/Minecraft 需要）
[multilib]
Include = /etc/pacman.d/mirrorlist

# archlinuxcn 仓库（备用，需要时启用）
#[archlinuxcn]
#Server = https://mirrors.tuna.tsinghua.edu.cn/archlinuxcn/$arch

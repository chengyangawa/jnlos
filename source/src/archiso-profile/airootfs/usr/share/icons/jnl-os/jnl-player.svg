<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 主体渐变：科技感深蓝紫 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1"/>
    </linearGradient>
    <!-- 高光渐变 -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <!-- 播放按钮渐变 -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
    <!-- 音波渐变 -->
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#f0abfc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0abfc;stop-opacity:0"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- 顶部高光 -->
  <rect x="16" y="16" width="224" height="120" rx="48" fill="url(#shine)"/>

  <!-- 左音波（4 根渐变高度） -->
  <g opacity="0.85">
    <rect x="60" y="118" width="8" height="20" rx="4" fill="white" opacity="0.6"/>
    <rect x="74" y="108" width="8" height="40" rx="4" fill="white" opacity="0.7"/>
    <rect x="88" y="92" width="8" height="72" rx="4" fill="white" opacity="0.85"/>
    <rect x="102" y="108" width="8" height="40" rx="4" fill="white" opacity="0.7"/>
  </g>

  <!-- 中心播放按钮（圆形，纯净白） -->
  <circle cx="148" cy="128" r="38" fill="url(#playGrad)" filter="url(#shadow)"/>
  <circle cx="148" cy="128" r="38" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- 播放三角形 -->
  <path d="M 138 110 L 138 146 L 168 128 Z" fill="#6366f1"/>

  <!-- 右音波 -->
  <g opacity="0.85">
    <rect x="194" y="118" width="8" height="20" rx="4" fill="white" opacity="0.6"/>
    <rect x="180" y="108" width="8" height="40" rx="4" fill="white" opacity="0.7"/>
    <rect x="166" y="92" width="8" height="72" rx="4" fill="white" opacity="0.85"/>
  </g>

  <!-- 顶部装饰：JNL 标识 -->
  <text x="128" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" opacity="0.9">JNL</text>

  <!-- 底部装饰：音符 -->
  <g transform="translate(128, 200)" opacity="0.7">
    <circle cx="-12" cy="-4" r="4" fill="white"/>
    <rect x="-8" y="-20" width="2" height="16" fill="white"/>
    <circle cx="6" cy="0" r="4" fill="white"/>
    <rect x="10" y="-16" width="2" height="16" fill="white"/>
    <path d="M 10 -16 Q 18 -14 18 -6" stroke="white" stroke-width="2" fill="none"/>
  </g>
</svg>
